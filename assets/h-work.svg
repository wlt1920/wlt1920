<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="01 SELECTED WORK">
  <style>
    .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2.4px; }
    .big { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', 'Oswald', 'Bebas Neue', sans-serif; letter-spacing: 1px; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) .1s both; }
    .fade { animation: fade .8s ease .5s both; }
    .draw { animation: draw 1.3s cubic-bezier(.6,0,.2,1) .2s both; }
    .dot { animation: dot 2.4s ease-in-out infinite; }
    @keyframes rise { from { transform: translateY(70px); } to { transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
    @keyframes dot { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
  <defs><clipPath id="c"><rect x="0" y="8" width="1200" height="70"/></clipPath></defs>
  <text x="20" y="38" class="mono fade" font-size="13" fill="#E6DCC8">01</text>
  <g clip-path="url(#c)"><text x="70" y="70" class="big rise" font-size="56" fill="#F1EFE7">SELECTED WORK</text></g>
  <line x1="393" y1="52" x2="1180" y2="52" stroke="#9A9486" stroke-opacity="0.55" stroke-width="1" class="draw" style="--len:787; stroke-dasharray:787"/>
  <circle cx="1180" cy="52" r="3.5" fill="#3DDC84" class="dot"/>
  <text x="1180" y="80" text-anchor="end" class="mono fade" font-size="11.5" fill="#9A9486">SHIPPED, USED, MAINTAINED</text>
</svg>
