<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Have a project or a role in mind? wltziff.nl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E100F"/><stop offset="1" stop-color="#090A0A"/></linearGradient>
    <radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E6DCC8" stop-opacity=".14"/><stop offset="1" stop-color="#E6DCC8" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="1200" height="200" rx="22"/></clipPath>
    <clipPath id="t"><rect x="0" y="40" width="1200" height="90"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2.4px; }
    .big { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', 'Oswald', 'Bebas Neue', sans-serif; letter-spacing: 1px; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) .1s both; }
    .fade { animation: fade .8s ease .5s both; }
    .draw { animation: draw 1.3s cubic-bezier(.6,0,.2,1) .2s both; }
    .dot { animation: dot 2.4s ease-in-out infinite; }
    @keyframes rise { from { transform: translateY(70px); } to { transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
    @keyframes dot { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  
    .drift { animation: drift 12s ease-in-out infinite alternate; }
    .marq { animation: marq 26s linear infinite; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-120px,20px); } }
    @keyframes marq { from { transform: translateX(0); } to { transform: translateX(-1250px); } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="200" fill="url(#bg)"/>
    <ellipse class="drift" cx="950" cy="80" rx="380" ry="200" fill="url(#g)"/>
    <g clip-path="url(#t)"><text x="44" y="118" class="big rise" font-size="78" fill="#F1EFE7">HAVE A PROJECT IN MIND?</text></g>
    <text x="1152" y="74" text-anchor="end" class="mono fade" font-size="12.5" fill="#3DDC84">● AVAILABLE</text>
    <text x="1152" y="118" text-anchor="end" class="sans fade" font-size="22" font-weight="700" fill="#E6DCC8">wltziff.nl ↗</text>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#F1EFE7" stroke-opacity=".10"/>
    <g class="marq">
      <text x="44" y="180" class="mono" font-size="12" fill="#9A9486">WEBSITES · WEB APPS · WINDOWS TOOLS · WORDPRESS · WOOCOMMERCE · REACT · C# / .NET · MOTION · PRIVACY-FIRST · FAST · CLEAR · FINISHED ·</text>
      <text x="1294" y="180" class="mono" font-size="12" fill="#9A9486">WEBSITES · WEB APPS · WINDOWS TOOLS · WORDPRESS · WOOCOMMERCE · REACT · C# / .NET · MOTION · PRIVACY-FIRST · FAST · CLEAR · FINISHED ·</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="199" rx="21.5" fill="none" stroke="#F1EFE7" stroke-opacity=".10"/>
</svg>
